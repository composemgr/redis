name: redis
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:

  redis:
    image: redis:latest
    container_name: redis-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: redis-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    volumes:
      - './volumes/db/redis/redis:/var/lib/redis/data:z'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.redis-redis.entrypoints=http'
      - 'traefik.http.routers.redis-redis.rule=Host(${BASE_HOST_NAME:-$HOSTNAME})'
      - 'traefik.http.routers.redis-redis.middlewares=redis-redis-https-redirect'
      - 'traefik.http.middlewares.redis-redis-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.redis-redis-secure.entrypoints=https'
      - 'traefik.http.routers.redis-redis-secure.rule=Host(${BASE_HOST_NAME:-$HOSTNAME})'
      - 'traefik.http.routers.redis-redis-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.redis-redis-secure.service=redis-redis'
      - 'traefik.http.services.redis-redis.loadbalancer.server.port=6379'
    networks:
      - redis
      - traefik

networks:
  redis:
    name: redis
    external: false
  traefik:
    name: traefik
    external: true
